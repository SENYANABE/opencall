name: Рубрики и обложки

on:
  # Расписание держит сервер (deploy/install.sh). Здесь только ручной запуск как запасной вариант.
  workflow_dispatch:
    inputs:
      format:
        description: "Что сделать черновиком"
        required: true
        type: choice
        options:
          - card_cover
          - digest
          - poll
          - nav

permissions:
  contents: write

concurrency:
  group: opencall-data
  cancel-in-progress: false

jobs:
  formats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Черновик рубрики редактору
        run: python opencall/formats.py
        env:
          FORMAT: ${{ inputs.format }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_EDITOR_CHAT_ID: ${{ secrets.TG_EDITOR_CHAT_ID }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
      - name: Сохранить лог
        if: always()
        run: |
          git config user.name "opencall-bot"
          git config user.email "opencall-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Лог: рубрика $(TZ=Europe/Moscow date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
